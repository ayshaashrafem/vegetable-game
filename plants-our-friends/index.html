<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#19a653">
<title>Plants, Our Friends — Touch Game</title>
<style>
:root{--green:#168b45;--ink:#24452f;--yellow:#ffe47a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100svh;padding:10px;display:grid;place-items:center;background:linear-gradient(140deg,#baf4c8,#e1f7ff 55%,#fff1b5);font-family:system-ui,Arial,sans-serif;color:var(--ink)}
.app{width:min(100%,760px);min-height:94svh;background:#ffffffed;border:5px solid white;border-radius:28px;box-shadow:0 10px 28px #286b3a30;padding:clamp(14px,3vw,26px);display:flex;flex-direction:column;align-items:center;text-align:center}
h1{font-size:clamp(27px,6vw,42px);color:#087b3a;margin:8px 0 4px}.sub{margin:0 0 14px;color:#56715e}
.screen{width:100%;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center}
.hero{font-size:clamp(70px,17vw,118px);margin:10px}
p{font-size:clamp(17px,4vw,22px);line-height:1.4}
.question{width:100%;padding:14px 12px;background:#fff2a8;border:3px solid #ffd34d;border-radius:20px;color:#614900;font-size:clamp(21px,5vw,30px);font-weight:900;margin:12px 0 16px}
.count{font-weight:900;color:#47704f}.progress{width:100%;height:12px;background:#e5eee5;border-radius:20px;overflow:hidden;margin:8px 0 12px}.bar{height:100%;background:linear-gradient(90deg,#20b45d,#a4df35);width:0;transition:width .2s}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.choice{min-width:0;min-height:clamp(130px,28vw,185px);border:4px solid #d6efdb;border-radius:20px;background:linear-gradient(160deg,#fff,#effff2);color:#214b2d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px 3px;box-shadow:0 5px 0 #b8d9bf;touch-action:manipulation;font:inherit}
.choice:active{transform:scale(.96)}.choice:focus-visible,.btn:focus-visible{outline:4px solid #1769aa;outline-offset:3px}
.pic{font-size:clamp(48px,12vw,78px);line-height:1.1}.label{font-size:clamp(14px,3.6vw,20px);font-weight:900}
.choice.correct{border-color:#1eaa50;background:#d9ffe3}.choice.wrong{border-color:#ed8b79;background:#fff0ed}
.feedback{min-height:48px;margin:14px 0 4px;font-size:clamp(23px,5vw,31px);font-weight:1000}.good{color:#13883c}.try{color:#d85a36}
.btn{display:none;border:0;border-radius:18px;padding:14px 28px;margin:8px;background:linear-gradient(#ffbd3e,#ff8a00);color:#542900;font-size:clamp(18px,4.5vw,23px);font-weight:1000;box-shadow:0 5px 0 #d96b00;touch-action:manipulation}
.screen .btn{display:inline-block}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d96b00}
.tiny{margin-top:auto;padding-top:12px;color:#77917e;font-size:12px}
@media(max-width:430px){body{padding:5px}.app{min-height:96svh;padding:12px 9px;border-radius:22px}.choices{gap:7px}.choice{min-height:130px;border-width:3px;border-radius:16px}.label{font-size:14px}.question{margin:10px 0 12px}}
@media(orientation:landscape) and (max-height:520px){.app{min-height:96svh;padding:7px 16px}h1{font-size:25px;margin:1px}.sub{margin-bottom:4px}.question{padding:7px;margin:5px}.choice{min-height:100px}.pic{font-size:43px}.feedback{min-height:30px;margin:3px}}
</style>
</head>
<body><main class="app">
<h1>🌱 Plants, Our Friends 🌱</h1><div class="sub">UKG • EVS • Touch and learn!</div>
<section class="screen" id="welcome"><div class="hero">🌳🌼🍎</div><p>Plants give us many things. Look at the pictures and touch the correct answer!</p><button class="btn" id="start">Let's Play! ▶</button></section>
<section id="game" style="display:none;width:100%;flex-direction:column;align-items:center">
<div class="count" id="count">Question 1 of 3</div><div class="progress"><div class="bar" id="bar"></div></div>
<div class="question" id="question"></div><div class="choices" id="choices"></div>
<div class="feedback" id="feedback" role="status" aria-live="polite"></div><button class="btn" id="next">Next Question ➜</button>
</section>
<section class="screen" id="finish" style="display:none"><div class="hero">🏆🌟🎉</div><h2 style="font-size:clamp(34px,8vw,52px);color:#0b8a40;margin:6px">Well Done!</h2><p>You answered all 3 questions. You are a little plant champion!</p><button class="btn" id="again">Play Again ↻</button></section>
<div class="tiny">Learn about plants • Play again and shine! ⭐</div></main>
<script>
const questions=[
 {text:"Which one comes from a plant?",choices:[["Apple","🍎",true],["Toy car","🚗",false],["Stone","🪨",false]]},
 {text:"Which plant gives us rice?",choices:[["Bamboo","🎋",false],["Rice plant","🌾",true],["Coconut","🥥",false]]},
 {text:"What do we get from the tea plant?",choices:[["Rice","🍚",false],["Paper","📄",false],["Tea","🍵",true]]}
];
let current=0,locked=false;
const el=id=>document.getElementById(id);
function showQuestion(){
 locked=false;const q=questions[current];el("count").textContent="Question "+(current+1)+" of 3";
 el("bar").style.width=(current/3*100)+"%";el("question").textContent=q.text;
 el("feedback").textContent="";el("feedback").className="feedback";el("next").style.display="none";el("choices").innerHTML="";
 q.choices.forEach(([label,emoji,right])=>{
  const b=document.createElement("button");b.type="button";b.className="choice";b.setAttribute("aria-label",label);
  const p=document.createElement("span");p.className="pic";p.textContent=emoji;
  const t=document.createElement("span");t.className="label";t.textContent=label;b.append(p,t);
  b.addEventListener("click",()=>choose(b,right));el("choices").appendChild(b);
 });
}
function choose(button,right){
 if(locked)return;
 if(right){locked=true;button.classList.add("correct");const tick=document.createElement("span");tick.textContent="✔";tick.style.cssText="font-size:28px;color:#12843b;font-weight:1000";button.appendChild(tick);
  el("feedback").textContent="✔ Great Job!";el("feedback").className="feedback good";
  [...el("choices").children].forEach(b=>b.disabled=true);el("bar").style.width=((current+1)/3*100)+"%";
  el("next").textContent=current===2?"Finish 🎉":"Next Question ➜";el("next").style.display="inline-block";
 }else{el("feedback").textContent="Try Again! 😊";el("feedback").className="feedback try";button.classList.add("wrong");setTimeout(()=>button.classList.remove("wrong"),450);}
}
function play(){current=0;el("welcome").style.display="none";el("game").style.display="flex";el("finish").style.display="none";showQuestion()}
el("start").addEventListener("click",play);el("again").addEventListener("click",play);
el("next").addEventListener("click",()=>{if(current<2){current++;showQuestion()}else{el("game").style.display="none";el("finish").style.display="flex";el("bar").style.width="100%"}});
</script></body></html>
